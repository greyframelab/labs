<!doctype html><html lang="es"><head><meta charset="utf-8"><title>VØID_LOOM · MENSAJERO · audio</title></head><body>
<script src="sonido.js"></script>
<script>
// render offline del audio de validación (mismo motor que en vivo)
async function renderAudio(o){
  const sr=48000, ctx=new OfflineAudioContext(2,Math.ceil(sr*o.dur),sr);
  const E=MensajeroSonido.Motor(ctx,ctx.destination,o), P=MensajeroSonido.Partitura(o); MensajeroSonido.programa(E,P,o);
  const buf=await ctx.startRendering(); const len=buf.length, out=new DataView(new ArrayBuffer(44+len*4)); const w=(p,s)=>{ for(let i=0;i<s.length;i++) out.setUint8(p+i,s.charCodeAt(i)); };
  w(0,'RIFF'); out.setUint32(4,36+len*4,true); w(8,'WAVE'); w(12,'fmt '); out.setUint32(16,16,true); out.setUint16(20,1,true); out.setUint16(22,2,true); out.setUint32(24,sr,true); out.setUint32(28,sr*4,true); out.setUint16(32,4,true); out.setUint16(34,16,true); w(36,'data'); out.setUint32(40,len*4,true);
  const a=buf.getChannelData(0), b=buf.getChannelData(1); let p=44; for(let i=0;i<len;i++){ out.setInt16(p,Math.max(-1,Math.min(1,a[i]))*32767,true); out.setInt16(p+2,Math.max(-1,Math.min(1,b[i]))*32767,true); p+=4; }
  let s=''; const u=new Uint8Array(out.buffer); for(let i=0;i<u.length;i+=32768) s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));
  return {wav:btoa(s),golpes:P.golpes,actos:P.actos};
}
window.MENSAJERO_AUDIO={renderAudio}; document.title='LISTO';
</script></body></html>
