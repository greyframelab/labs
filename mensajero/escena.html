<!doctype html><html lang="es"><head><meta charset="utf-8"><title>VØID_LOOM · MENSAJERO</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block;position:absolute;inset:0}</style></head><body>
<canvas id="t"></canvas>
<script src="../murmullo/testigo.js"></script>
<script type="module">
// ======================================================================
// VØID_LOOM · MENSAJERO — escena (validación)
// La antena DSN de 70 m (modelo real de NASA 3D Resources) apunta donde apunta la de verdad.
// A oscuras es solo una silueta negra que tapa las estrellas. En el cielo, la nave es un punto de luz.
// Cada paquete de su señal baja por el eje como una onda plana que REVELA la antena en puntos de luz
// (cuenco, celosía, pedestal, suelo) y concentra la energía en el foco. La señal dibuja a quien la escucha.
// ======================================================================
import * as THREE from '../rostro/vendor/three-rostro.js';
const Q=new URLSearchParams(location.search);
const W=+(Q.get('w')||1280), H=+(Q.get('h')||720);
const ACC=new THREE.Color('#'+(Q.get('acento')||'e9eef7'));
const R=new THREE.WebGLRenderer({antialias:false,preserveDrawingBuffer:true,powerPreference:'high-performance'});
R.setSize(W,H); R.setPixelRatio(1); R.autoClear=true; document.body.insertBefore(R.domElement,document.body.firstChild);
const S=new THREE.Scene(); S.background=null;
const cam=new THREE.PerspectiveCamera(40,W/H,.3,6000);
const tcv=document.getElementById('t'); tcv.width=W; tcv.height=H; const tc=tcv.getContext('2d');

// ---------------------------------------------------------------- cielo: estrellas, Vía Láctea, niebla en el horizonte
const cielo=new THREE.Mesh(new THREE.SphereGeometry(4000,64,32),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,uniforms:{T:{value:0}},
  vertexShader:`varying vec3 d; void main(){ d=normalize(position); vec4 p=projectionMatrix*modelViewMatrix*vec4(position,1.); gl_Position=p.xyww; }`,
  fragmentShader:`varying vec3 d; uniform float T;
  float h(vec3 p){ return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453); }
  float vn(vec3 p){ vec3 i=floor(p),f=fract(p); f=f*f*(3.-2.*f); return mix(mix(mix(h(i),h(i+vec3(1,0,0)),f.x),mix(h(i+vec3(0,1,0)),h(i+vec3(1,1,0)),f.x),f.y),mix(mix(h(i+vec3(0,0,1)),h(i+vec3(1,0,1)),f.x),mix(h(i+vec3(0,1,1)),h(i+1.),f.x),f.y),f.z); }
  void main(){ vec3 n=normalize(d);
    // estrellas: tres capas de tamaño/brillo
    vec3 col=vec3(0);
    for(int k=0;k<3;k++){ float sc=float(k)==0.?220.:float(k)==1.?480.:900.; vec3 c=floor(n*sc); vec3 f=fract(n*sc)-.5; float r=h(c+float(k)*17.);
      float b=pow(r,float(k)==0.?140.:float(k)==1.?110.:120.)*(float(k)==0.?2.6:float(k)==1.?1.1:.45); float s=exp(-dot(f,f)*(float(k)==0.?90.:140.)); col+=vec3(.85,.9,1.)*b*s; }
    // Vía Láctea: banda tenue con grumos oscuros
    vec3 g=normalize(vec3(.32,.62,-.71)); float band=exp(-pow(dot(n,g),2.)*14.); float dust=vn(n*7.)*.6+vn(n*17.)*.4;
    col+=vec3(.55,.6,.72)*band*(.008+.022*dust*dust)*smoothstep(-.05,.2,n.y);
    col+=vec3(.85,.9,1.)*band*pow(h(floor(n*1400.)),90.)*.9;
    // niebla del horizonte
    col+=vec3(.36,.41,.52)*exp(-max(n.y,0.)*7.)*smoothstep(-.08,.01,n.y)*.022;
    col*=smoothstep(-.05,.02,n.y);
    gl_FragColor=vec4(col,1.); }`}));
cielo.renderOrder=-10; S.add(cielo);

// ---------------------------------------------------------------- el modelo
const buf=await (await fetch('modelo/dsn70.bin')).arrayBuffer();
const hl=new DataView(buf).getUint32(0,true); const head=JSON.parse(new TextDecoder().decode(new Uint8Array(buf,4,hl))); const base=4+hl;
const G={fijo:new THREE.Group(),azimut:new THREE.Group(),elevacion:new THREE.Group()};
S.add(G.fijo); S.add(G.azimut); G.azimut.add(G.elevacion); G.elevacion.position.set(...head.ejeElevacion);
// silueta: el sólido en negro casi absoluto (tapa estrellas y puntos traseros)
const negro=new THREE.MeshBasicMaterial({color:0x010101,side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1});
const DENS={panel:9,celosia:60,cuadripode:70,receptor:40,estructura:7,baranda:50,hormigon:5};
const GID={fijo:0,azimut:1,elevacion:2};
const P=[], N=[], K=[];          // posición local, normal, (grupo, material, azar)
let fy=0;
for(const p of head.piezas){
  let o=base+p.pos; const pos=new Float32Array(buf,o,p.nv*3); o+=p.nv*12; const nor=new Float32Array(buf,o,p.nv*3); o+=p.nv*12; const idx=new Uint32Array(buf,o,p.ni);
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pos,3)); g.setIndex(new THREE.BufferAttribute(idx,1));
  G[p.grupo].add(new THREE.Mesh(g,negro));
  if(p.nombre==='quad'){ g.computeBoundingBox(); fy=g.boundingBox.max.y; }
  // muestreo de la superficie: puntos proporcionales al área (más densos en lo fino: celosía, trípode)
  const d=DENS[p.mat]||8, mid=['panel','celosia','cuadripode','receptor','estructura','baranda','hormigon'].indexOf(p.mat);
  let acc=Math.random();
  for(let t=0;t<p.ni;t+=3){ const a=idx[t]*3,b=idx[t+1]*3,c=idx[t+2]*3;
    const ux=pos[b]-pos[a],uy=pos[b+1]-pos[a+1],uz=pos[b+2]-pos[a+2], vx=pos[c]-pos[a],vy=pos[c+1]-pos[a+1],vz=pos[c+2]-pos[a+2];
    const cx=uy*vz-uz*vy, cy=uz*vx-ux*vz, cz=ux*vy-uy*vx; const area=.5*Math.hypot(cx,cy,cz);
    acc+=area*d; let n=Math.floor(acc); acc-=n; n=Math.min(n,400);
    for(let k=0;k<n;k++){ let r1=Math.random(), r2=Math.random(); if(r1+r2>1){ r1=1-r1; r2=1-r2; }
      P.push(pos[a]+ux*r1+vx*r2, pos[a+1]+uy*r1+vy*r2, pos[a+2]+uz*r1+vz*r2); N.push(nor[a],nor[a+1],nor[a+2]); K.push(GID[p.grupo],mid,Math.random()); } }
}
// el suelo también responde: polvo en un disco alrededor de la antena
for(let i=0;i<60000;i++){ const r=Math.sqrt(Math.random())*190+6, a=Math.random()*6.2832; P.push(Math.cos(a)*r,.05,Math.sin(a)*r); N.push(0,1,0); K.push(0,7,Math.random()); }
const NP=P.length/3; console.log('puntos',NP);
// ---------------------------------------------------------------- los puntos: revelados por la onda de la señal
const U={T:{value:0},Mfijo:{value:new THREE.Matrix4()},Maz:{value:new THREE.Matrix4()},Mel:{value:new THREE.Matrix4()},
  eje:{value:new THREE.Vector3()},foco:{value:new THREE.Vector3()},golpes:{value:new Float32Array(8).fill(-99)},acc:{value:ACC},px:{value:H/720},sen:{value:1},camP:{value:new THREE.Vector3()},expo:{value:1}};
const pg=new THREE.BufferGeometry(); pg.setAttribute('position',new THREE.Float32BufferAttribute(P,3)); pg.setAttribute('nrm',new THREE.Float32BufferAttribute(N,3)); pg.setAttribute('k',new THREE.Float32BufferAttribute(K,3));
const pm=new THREE.ShaderMaterial({uniforms:U,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  vertexShader:`attribute vec3 nrm; attribute vec3 k; uniform mat4 Mfijo,Maz,Mel; uniform vec3 eje,foco,camP,acc; uniform float T,golpes[8],px,sen; varying vec3 vC; varying float vA;
  void main(){ mat4 M=k.x<.5?Mfijo:(k.x<1.5?Maz:Mel); vec4 wp=M*vec4(position,1.); vec3 wn=normalize(mat3(M)*nrm);
    // coordenada a lo largo del eje: 0 en el foco, negativa hacia el cuenco y el suelo
    float s=dot(wp.xyz-foco,eje);
    float lum=0., blanco=0.;
    for(int i=0;i<8;i++){ float th=golpes[i]; float age=T-th; if(age<-1.2||age>4.) continue;
      // la onda plana llega del cielo: cruza el foco 0,25 s antes del golpe y barre hacia abajo a 60 m/s
      float sf=-60.*(age+.25); float x=(s-sf)/3.6;
      float frente=exp(-x*x);
      float estela=s>sf?exp(-(s-sf)/22.)*exp(-max(age+.25,0.)*.9)*.55+.12*exp(-max(age+.25,0.)*.45):0.;
      float dist=length(wp.xyz-foco); float foc=age>0.?exp(-dist/3.5)*exp(-age*4.)*.15:0.;   // la energía se concentra en el foco
      lum+=frente*.75+estela+foc; blanco+=frente; }
    float mid=k.y;
    float junta=1.;
    if(mid<.5){ float r=length(position.xz); float an=atan(position.z,position.x); float ring=abs(fract(r/2.9)-.5); float rad=abs(fract(an/6.2832*(24.+floor(r/2.9)*6.))-.5);
      junta=.35+2.2*smoothstep(.4,.5,max(ring,rad)); }
    float g=mid<.5?1.:mid<1.5?.75:mid<2.5?.45:mid<3.5?.3:mid<4.5?.45:mid<5.5?.6:mid<6.5?.3:.22;
    // un leve brillo propio del cuenco que respira con la potencia de la señal (la antena "escucha")
    float vivo=(mid<.5?.035:mid<1.5?.02:.008)*sen;
    lum=lum*g*junta*sen+vivo*(mid<.5?junta*.6:1.);
    // orientación respecto a la cámara: los puntos de cara brillan algo más (lectura de forma)
    vec3 V=normalize(camP-wp.xyz); lum*=.55+.45*abs(dot(wn,V));
    vec4 mv=viewMatrix*wp; gl_Position=projectionMatrix*mv;
    float dz=-mv.z; gl_PointSize=clamp(px*(1.6+k.z*1.2)*(60./dz),1.,4.)*(1.+blanco*.4); lum*=clamp(dz/12.,.25,1.);
    vC=mix(vec3(.82,.87,.97),acc,.5)*lum; vA=lum; if(lum<.002) gl_Position=vec4(9.,9.,9.,1.); }`,
  fragmentShader:`varying vec3 vC; varying float vA; void main(){ vec2 q=gl_PointCoord-.5; float r=length(q); float a=1.-smoothstep(.15,.5,r); gl_FragColor=vec4(vC*a,1.); }`});
const nube=new THREE.Points(pg,pm); nube.frustumCulled=false; S.add(nube);

// ---------------------------------------------------------------- la nave en el cielo y sus fotones
const navePts=new THREE.BufferGeometry(); { const a=[], kk=[]; for(let i=0;i<900;i++){ a.push(0,0,0); kk.push(Math.random(),Math.random(),Math.random()); } navePts.setAttribute('position',new THREE.Float32BufferAttribute(a,3)); navePts.setAttribute('k',new THREE.Float32BufferAttribute(kk,3)); }
const fotonM=new THREE.ShaderMaterial({uniforms:U,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  vertexShader:`attribute vec3 k; uniform vec3 eje,foco; uniform float T,golpes[8],px,sen; varying float vL;
  void main(){ vec3 lado=normalize(cross(eje,vec3(0,1,0))), arr=cross(lado,eje);
    float L=900.; vL=0.; vec3 p=foco+eje*L;
    // cada paquete: un grupo de fotones que cae del cielo y llega al foco 0,25 s antes del golpe
    int g=int(k.x*8.); float th=golpes[g]; float u=1.-((th-.25)-T)/2.4 + (k.y-.5)*.06;
    if(u>0.&&u<1.){ float e=u*u*u; p=foco+eje*L*(1.-e); vL=(.4+.6*u)*sen; }
    // llovizna de bits: lo que la nave emite sin parar (densidad = velocidad de datos)
    else if(k.z<.35){ float uu=fract(k.y+T*.18); p=foco+eje*L*(1.-uu*uu*uu); vL=.18*sen*uu; }
    p+=(lado*(k.y-.5)+arr*(k.z-.5))*(.6+ (1.-vL)*1.);
    vec4 mv=viewMatrix*vec4(p,1.); gl_Position=projectionMatrix*mv; gl_PointSize=clamp(px*3.*(120./-mv.z),1.,5.)+px*2.;
    if(vL<.01) gl_Position=vec4(9.,9.,9.,1.); }`,
  fragmentShader:`uniform vec3 acc; varying float vL; void main(){ vec2 q=gl_PointCoord-.5; float a=1.-smoothstep(0.,.5,length(q)); gl_FragColor=vec4(mix(vec3(.85,.9,1.),acc,.5)*vL*a*2.2,1.); }`});
const fotones=new THREE.Points(navePts,fotonM); fotones.frustumCulled=false; S.add(fotones);
// la nave: un punto que late
const naveM=new THREE.ShaderMaterial({uniforms:U,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  vertexShader:`uniform vec3 eje,foco; uniform float px; void main(){ vec4 mv=viewMatrix*vec4(foco+eje*2400.,1.); gl_Position=projectionMatrix*mv; gl_PointSize=px*26.; }`,
  fragmentShader:`uniform float T,sen,golpes[8]; uniform vec3 acc; void main(){ vec2 q=gl_PointCoord-.5; float r=length(q); float pul=0.; for(int i=0;i<8;i++){ float a=T-(golpes[i]-2.65); if(a>0.&&a<.6) pul+=exp(-a*5.); }
    float core=exp(-r*r*900.)*1.8+exp(-r*r*120.)*.35*(1.+pul*2.); gl_FragColor=vec4(mix(vec3(.9,.94,1.),acc,.4)*core*(.5+.5*sen),1.); }`});
const nave=new THREE.Points(new THREE.BufferGeometry().setAttribute('position',new THREE.Float32BufferAttribute([0,0,0],3)),naveM); nave.frustumCulled=false; S.add(nave);

// ---------------------------------------------------------------- posproceso propio: profundidad de campo, bloom, ACES, grano
const rt=new THREE.WebGLRenderTarget(W,H,{type:THREE.HalfFloatType}); rt.depthTexture=new THREE.DepthTexture(W,H); rt.depthTexture.type=THREE.FloatType;
const b1=new THREE.WebGLRenderTarget(W>>2,H>>2,{type:THREE.HalfFloatType}), b2=b1.clone();
const quad=new THREE.Mesh(new THREE.PlaneGeometry(2,2)); const oc=new THREE.OrthographicCamera(-1,1,1,-1,0,1); const qs=new THREE.Scene(); qs.add(quad);
const VQ=`varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }`;
const Mb=new THREE.ShaderMaterial({uniforms:{t:{value:null},px:{value:new THREE.Vector2(1/W,1/H)}},vertexShader:VQ,fragmentShader:`uniform sampler2D t; uniform vec2 px; varying vec2 vUv; void main(){ vec3 c=vec3(0); for(int i=-1;i<=1;i++) for(int j=-1;j<=1;j++) c+=min(texture2D(t,vUv+vec2(i,j)*px*2.).rgb,vec3(20.)); c/=9.; float l=max(c.r,max(c.g,c.b)); gl_FragColor=vec4(c*smoothstep(.5,1.6,l),1.); }`});
const Mbl=new THREE.ShaderMaterial({uniforms:{t:{value:null},dir:{value:new THREE.Vector2()}},vertexShader:VQ,fragmentShader:`uniform sampler2D t; uniform vec2 dir; varying vec2 vUv; void main(){ vec3 c=texture2D(t,vUv).rgb*.227; float w[4]; w[0]=.194; w[1]=.121; w[2]=.054; w[3]=.016; for(int i=0;i<4;i++){ vec2 d=dir*float(i+1)*1.7; c+=(texture2D(t,vUv+d).rgb+texture2D(t,vUv-d).rgb)*w[i]; } gl_FragColor=vec4(c,1.); }`});
const Mf=new THREE.ShaderMaterial({uniforms:{t:{value:rt.texture},dep:{value:rt.depthTexture},bl:{value:b1.texture},res:{value:new THREE.Vector2(W,H)},near:{value:cam.near},far:{value:cam.far},foco:{value:50},apert:{value:1},tt:{value:0},expo:{value:1}},vertexShader:VQ,
  fragmentShader:`uniform sampler2D t,dep,bl; uniform vec2 res; uniform float near,far,foco,apert,tt,expo; varying vec2 vUv;
  float lin(float d){ float z=d*2.-1.; return 2.*near*far/(far+near-z*(far-near)); }
  float h1(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
  void main(){ float z=lin(texture2D(dep,vUv).r); float coc=clamp(abs(z-foco)/max(z,.1)*apert,0.,1.);
    vec3 acc=texture2D(t,vUv).rgb; float ws=1.;
    if(coc>.02){ float Rr=coc*res.y*.02; for(int i=0;i<32;i++){ float a=float(i)*2.39996; float rr=sqrt(float(i)+.5)/sqrt(32.)*Rr; vec2 o=vec2(cos(a),sin(a))*rr/res; vec3 s=texture2D(t,vUv+o).rgb; float zs=lin(texture2D(dep,vUv+o).r); float cs=clamp(abs(zs-foco)/max(zs,.1)*apert,0.,1.); float w=smoothstep(0.,.5,cs)+.08; acc+=s*w; ws+=w; } }
    vec3 c=acc/ws+texture2D(bl,vUv).rgb*.45; c*=expo; c=c*(2.51*c+.03)/(c*(2.43*c+.59)+.14);
    vec2 q=vUv-.5; c*=1.-dot(q,q)*.7; c+=(h1(vUv*res+fract(tt*13.)*91.)-.5)*.005*(.3+c);
    gl_FragColor=vec4(pow(max(c,0.),vec3(1./2.2)),1.); }`});
function pase(m,target){ quad.material=m; R.setRenderTarget(target); R.render(qs,oc); }

// ---------------------------------------------------------------- apuntar y planos
function apunta(az,el){ G.elevacion.rotation.x=-(Math.PI/2-el*Math.PI/180); G.azimut.rotation.y=-az*Math.PI/180; S.updateMatrixWorld(true); }
const eje=()=>new THREE.Vector3(0,1,0).applyQuaternion(G.elevacion.getWorldQuaternion(new THREE.Quaternion())).normalize();
const centro=()=>G.elevacion.localToWorld(new THREE.Vector3(0,14,0));
const focoW=()=>G.elevacion.localToWorld(new THREE.Vector3(0,fy-3.5,0));
const V3=(x,y,z)=>new THREE.Vector3(x,y,z);
window.PLANOS={
  // HÉROE: desde el suelo, de tres cuartos; la antena tapa las estrellas
  HEROE:(tl)=>{ const c=centro(), a=eje(); const h=V3(a.x,0,a.z).normalize(), lado=V3(h.z,0,-h.x); cam.fov=50; cam.position.copy(c).addScaledVector(h,38-tl*.6).addScaledVector(lado,-86+tl*.9); cam.position.y=1.7; cam.lookAt(c.x,c.y+8,c.z); return cam.position.distanceTo(c); },
  // CIELO: desde el vértice del cuenco, mirando por el eje: el trípode, la nave, los fotones que bajan
  CIELO:(tl)=>{ const c=centro(), a=eje(), f=focoW(); const lado=new THREE.Vector3().crossVectors(a,V3(0,1,0)).normalize(); cam.fov=58-tl*.4; cam.position.copy(c).addScaledVector(a,-4).addScaledVector(lado,9); cam.lookAt(f.clone().addScaledVector(a,140).addScaledVector(lado,-14)); return 300; },
  // CUENCO: de frente, dentro de la parábola
  CUENCO:(tl)=>{ const c=centro(), a=eje(); const lado=new THREE.Vector3().crossVectors(a,V3(0,1,0)).normalize(); cam.fov=36-tl*.3; cam.position.copy(c).addScaledVector(a,92-tl*1.1).addScaledVector(lado,24); cam.lookAt(c.clone().addScaledVector(a,8)); return cam.position.distanceTo(c)-6; },
  // FOCO: junto al receptor; profundidad de campo corta
  FOCO:(tl)=>{ const c=centro(), a=eje(), f=focoW(); const lado=new THREE.Vector3().crossVectors(a,V3(0,1,0)).normalize(); cam.fov=40; cam.position.copy(f).addScaledVector(a,-6+tl*.2).addScaledVector(lado,11-tl*.3); cam.lookAt(c.clone().addScaledVector(a,6)); return cam.position.distanceTo(f)+2; },
  // NOCHE: lejos, de perfil
  NOCHE:(tl)=>{ const c=centro(), a=eje(); const h=V3(a.x,0,a.z).normalize(), lado=V3(h.z,0,-h.x); cam.fov=26-tl*.1; cam.position.copy(c).addScaledVector(lado,-300+tl*2).addScaledVector(h,-50); cam.position.y=6; cam.lookAt(c.x,c.y*.7,c.z); return cam.position.distanceTo(c); },
};
window.dibuja=(st)=>{
  apunta(st.az,st.el);
  const gl=st.golpes.concat(Array(8).fill(-99)).slice(0,8); U.golpes.value.set(gl);
  U.T.value=st.t; U.sen.value=st.sen; U.eje.value.copy(eje()); U.foco.value.copy(focoW());
  U.Mfijo.value.copy(G.fijo.matrixWorld); U.Maz.value.copy(G.azimut.matrixWorld); U.Mel.value.copy(G.elevacion.matrixWorld);
  const fd=window.PLANOS[st.plano](st.tl||0); cam.aspect=W/H; cam.updateProjectionMatrix(); cam.updateMatrixWorld(); U.camP.value.copy(cam.position);
  R.setRenderTarget(rt); R.setClearColor(0x000000,1); R.clear(); R.render(S,cam);
  Mb.uniforms.t.value=rt.texture; pase(Mb,b1);
  for(let i=0;i<2;i++){ Mbl.uniforms.t.value=b1.texture; Mbl.uniforms.dir.value.set(1/b1.width,0); pase(Mbl,b2); Mbl.uniforms.t.value=b2.texture; Mbl.uniforms.dir.value.set(0,1/b1.height); pase(Mbl,b1); }
  Object.assign(Mf.uniforms.foco,{value:fd}); Mf.uniforms.apert.value=st.plano==='FOCO'?2.2:st.plano==='CIELO'?.12:.35; Mf.uniforms.tt.value=st.t; Mf.uniforms.expo.value=st.expo??1;
  pase(Mf,null);
  // TESTIGO (solo con datos en vivo; aquí para validar)
  tc.clearRect(0,0,W,H); if(st.testigo){ dibujaTestigo(tc,W,H,st.testigo.lineas,st.testigo.k,st.testigo.a,[ACC.r,ACC.g,ACC.b]); }
  const o=document.createElement('canvas'); o.width=W; o.height=H; const x=o.getContext('2d'); x.drawImage(R.domElement,0,0); x.drawImage(tcv,0,0); return o.toDataURL('image/jpeg',.93);
};
document.title='LISTO';
</script></body></html>
