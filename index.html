<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Greyframe Labs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;700&family=Open+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: lab notebook. Latest experiment as a wide feature, older ones in a grid below. Greyframe identity, dark by design. */
:root{
  --bg:#15181c; --surface:#20252b; --surface-2:#262c33;
  --text:#e8ecef; --muted:#aab3bb; --dim:#5c6670;
  --accent:#2fd1c5; --alert:#7a2035;
  --line:rgba(232,236,239,.09);
  --display:"Roboto Slab",Rockwell,Georgia,serif;
  --body:"Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:54px 54px;background-position:-1px -1px}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:56px 72px;display:flex;flex-direction:column;gap:48px}
@media (min-width:760px){.wrap{padding-inline:40px;padding-block:88px 96px}}
header{display:flex;flex-direction:column;gap:14px}
.brand{font:500 12px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.brand b{color:var(--accent);font-weight:500}
h1{font:700 clamp(64px,13vw,148px)/.9 var(--display);margin:0;letter-spacing:-.02em}
h1 span{color:var(--accent)}
.intro{max-width:52ch;color:var(--muted);font-size:18px;margin:0}
.meta-row{display:flex;flex-wrap:wrap;gap:8px 20px;font:400 12px/1.4 var(--mono);color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.meta-row strong{color:var(--text);font-weight:500}

.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:16px}
.card{position:relative;display:flex;flex-direction:column;gap:12px;padding:24px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:inherit;text-decoration:none;transition:transform .25s cubic-bezier(.2,.9,.3,1),border-color .25s}
.card:hover{transform:translateY(-3px);border-color:rgba(47,209,197,.5)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.card .num{font:700 72px/.8 var(--display);color:var(--surface-2);-webkit-text-stroke:1px rgba(232,236,239,.14);letter-spacing:-.03em}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.tag{font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:5px 8px;border-radius:4px;background:rgba(47,209,197,.12);color:var(--accent);white-space:nowrap}
.card h2{font:700 28px/1.05 var(--display);margin:0;text-wrap:balance}
.card p{margin:0;color:var(--muted)}
.card .date{margin-top:auto;padding-top:8px;font:400 12px/1 var(--mono);letter-spacing:.08em;color:var(--dim);text-transform:uppercase;display:flex;justify-content:space-between}
.card .go{color:var(--accent)}
.card.feature{grid-column:1/-1;padding:clamp(24px,4vw,44px);background:linear-gradient(135deg,var(--surface),#1a1f24)}
.card.feature .num{font-size:clamp(96px,18vw,180px);color:transparent;-webkit-text-stroke:1.5px var(--accent);opacity:.9}
.card.feature h2{font-size:clamp(36px,6vw,64px)}
.card.feature p{font-size:19px;max-width:44ch;color:var(--text)}
.latest{font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--text)}
.latest::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:8px;vertical-align:1px;box-shadow:0 0 0 0 rgba(47,209,197,.6);animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 8px rgba(47,209,197,0)}100%{box-shadow:0 0 0 0 rgba(47,209,197,0)}}
footer{font:400 12px/1.6 var(--mono);color:var(--dim);letter-spacing:.04em;border-top:1px solid var(--line);padding-top:20px}
@media (prefers-reduced-motion:reduce){.card{transition:none}.latest::before{animation:none}}
</style>

<div class="wrap">
  <header>
    <div class="brand"><b>Greyframe</b> · Labs</div>
    <h1>Labs<span>.</span></h1>
    <p class="intro">Experiments in UI, motion and creative coding for games, apps and interfaces. Small ideas, built to be played with. A new one every day.</p>
    <div class="meta-row"><span>Experiments <strong id="count">0</strong></span><span>Latest <strong id="latestDate">—</strong></span></div>
  </header>
  <div class="list" id="list"></div>
  <footer>Built by Toni Santafé, game UI/UX designer. Each lab runs in the browser on desktop and mobile.</footer>
</div>

<!-- Newest first. Add each new lab at the top of this array. -->
<script type="application/json" id="labs-data">
[
  {
    "num": 4,
    "slug": "lab-04-sap-points",
    "title": "Sap Points",
    "category": "UI",
    "date": "2026-10-07",
    "idea": "What if skill points were sap? Every move pumps sap into its branch, buds bloom into skills, and pruning is your respec.",
    "artifact": "https://claude.ai/artifact/GNVquWu942A1jxYH4q5tPZ"
  },
  {
    "num": 3,
    "slug": "lab-03-against-the-grain",
    "title": "Against the Grain",
    "category": "Creative Coding",
    "date": "2026-10-06",
    "idea": "What if you could groom the green before you putt? Brush the grass to lay its grain and the ball follows the line you combed.",
    "artifact": "https://claude.ai/artifact/4ykMK2gAxYprEQkVMiCax5"
  },
  {
    "num": 2,
    "slug": "lab-02-ghost-type",
    "title": "Ghost Type",
    "category": "Motion",
    "date": "2026-10-05",
    "idea": "What if a ghost was made of the words it can't stop thinking? Rush in and it scrambles, stay still and it trusts you, leave and it remembers.",
    "artifact": "https://claude.ai/artifact/RsmCfNV2Vm8AkgyNkjQs4J"
  },
  {
    "num": 1,
    "slug": "lab-01-skid-bar",
    "title": "Skid Bar",
    "category": "UI",
    "date": "2026-10-03",
    "idea": "What if the scrollbar had tyres? Scroll to drive, reverse to spin, brake to slide, and race your best lap.",
    "artifact": "https://claude.ai/artifact/MYCz2P3xSf4c7TeSHzoY2P"
  }
]
</script>
<script>
(() => {
  const labs = JSON.parse(document.getElementById('labs-data').textContent);
  const onPages = /github\.io$/.test(location.hostname);
  const fmt = d => new Date(d + 'T12:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const list = document.getElementById('list');
  list.innerHTML = labs.map((l, i) => `
    <a class="card${i === 0 ? ' feature' : ''}" href="${esc(onPages ? l.slug + '/' : l.artifact)}" ${onPages ? '' : 'target="_blank" rel="noopener"'}>
      <div class="top"><span class="num">${String(l.num).padStart(2, '0')}</span><span class="tag">${esc(l.category)}</span></div>
      ${i === 0 ? '<span class="latest">Latest lab</span>' : ''}
      <h2>${esc(l.title)}</h2>
      <p>${esc(l.idea)}</p>
      <div class="date"><span>Lab #${String(l.num).padStart(2, '0')} · ${fmt(l.date)}</span><span class="go">Open →</span></div>
    </a>`).join('');
  document.getElementById('count').textContent = labs.length;
  if (labs[0]) document.getElementById('latestDate').textContent = fmt(labs[0].date);
})();
</script>
