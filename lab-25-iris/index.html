<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Iris</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&display=swap">
<style>
:root{--w:#e8eaed;--dim:rgba(232,234,237,.42);--red:#ff1a1a}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;inset:0;pointer-events:none;font:300 10px/1.5 "JetBrains Mono",monospace;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.hud .tl{position:absolute;left:30px;top:40px}
.hud .tr{position:absolute;right:30px;top:40px;text-align:right}
.hud .bl{position:absolute;left:30px;bottom:40px}
.hud .br{position:absolute;right:30px;bottom:40px;text-align:right}
.hud b{color:var(--w);font-weight:400}
.hud .ttl{font-weight:600;font-size:12px;letter-spacing:.5em;color:var(--w)}
.hud .rule{position:absolute;left:30px;right:30px;height:1px;background:rgba(232,234,237,.08)}
.hud .r1{top:80px}.hud .r2{bottom:80px}
.hud .red{color:var(--red)}
.hud .cap{position:absolute;left:0;right:0;bottom:150px;text-align:center;font-size:12px;letter-spacing:.7em;color:var(--w);opacity:0;font-weight:400}
.hud .sig{position:absolute;left:0;right:0;top:calc(50% + 120px);text-align:center;font-size:10px;letter-spacing:.6em;color:var(--w);opacity:0}
.hud .sig i{font-style:normal;color:var(--red)}
.hud .snd{position:absolute;left:0;right:0;bottom:100px;text-align:center;font-size:8px;letter-spacing:.4em;color:rgba(232,234,237,.35)}
.lbl{position:absolute;font-size:8px;letter-spacing:.18em;color:rgba(232,234,237,.6);white-space:nowrap;opacity:0}
.lbl:before{content:"";position:absolute;left:-18px;top:6px;width:14px;height:1px;background:rgba(232,234,237,.5)}
.lbl b{color:var(--red);font-weight:400}
.ticks{position:absolute;left:30px;right:30px;top:86px;height:6px;background:repeating-linear-gradient(90deg,rgba(232,234,237,.18) 0 1px,transparent 1px 12px)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <div class="tl"><div class="ttl">Iris</div><div>Ø-27 · <span id="ph">Latencia</span></div></div>
  <div class="tr"><div>TC <b id="tc">00:00:00:00</b></div><div>FR <b id="fr">0000</b></div></div>
  <div class="rule r1"></div><div class="ticks"></div><div class="rule r2"></div>
  <div class="bl"><div>R <b>56</b> · SEG <b id="seg">0</b> · Θ <b id="th">0.000</b></div><div>APERTURA <b id="fn">f/22</b> · <span class="red" id="st">BUSCANDO</span></div></div>
  <div class="br"><div>Z <b id="zz">0.00</b> · LOCK <b id="lk">00</b>/56</div><div>Δ <b id="dl">+0.000</b></div></div>
  <div class="lbl" id="l0"></div><div class="lbl" id="l1"></div><div class="lbl" id="l2"></div>
  <div class="cap" id="cap"></div>
  <div class="snd" id="snd">[ Toca para sonido ]</div>
  <div class="sig" id="sig">Greyframe <i>·</i> Motion 27</div>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">

// ---------- timeline (shared by image and sound) ----------

// ---------- the rings ----------

const pos = [], aRing = [], aAng = [], aRad = [], aB = [], aRed = [], aSeed = [], aKeep = [];

// ---------- HUD ----------
const pad = (n, l) => String(n).padStart(l, '0');
const LBL = [[14, 'l0'], [31, 'l1'], [47, 'l2']];
const v3 = new THREE.Vector3();
const CAPS = [[.25, 1.9, 'Algo despierta'], [3.0, 6.0, 'Calibrando'], [10.2, 13.6, 'Más adentro'], [16.95, 18.25, 'Te encontró']];
function hud(t, frame, lockN, rots) {

  $('ph').textContent = t > T_LOCK0 && t < T_BOOM ? 'Enfoque' : PH[ph];
  $('seg').textContent = SEGS; $('th').textContent = (((rots[RED_LBL] % TAU) + TAU) % TAU).toFixed(3);
  const fn = [22, 16, 11, 8, 5.6, 4, 2.8, 2, 1.4][Math.min(8, Math.floor(openAt(t) * 8.4))];
  $('fn').textContent = 'f/' + fn;
  $('st').textContent = t < 2 ? 'Buscando' : t < 9 ? 'Calibrando' : t < T_LOCK0 ? 'Rastreando' : t < T_BOOM ? 'Enfocado' : t < 19.6 ? 'Ruptura' : 'Eco';

    el.innerHTML = `R${pad(ri, 2)} · <b>${((a * 180 / Math.PI) % 360 + 360).toFixed(1).padStart(5, '0')}°</b> · ${(g.r * U.uRS.value[ri]).toFixed(3)}`; }
