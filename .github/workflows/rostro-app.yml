# VØID_LOOM · ROSTRO · genera la app de escritorio para Windows y Mac
# Se ejecuta al cambiar rostro/ o rostro-app/ en main, o a mano desde la pestaña Actions.
# En una PR también genera la app (artefactos descargables desde la ejecución) para probarla antes del merge.
# Mete dentro la cara, la tipografía y la visión de ESPEJO: la app funciona sin internet.
# Deja los ejecutables en la release "rostro-app-latest" del repo.
name: VØID_LOOM · ROSTRO · app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['rostro/**', 'ojo/vendor/**', 'ojo/models/**', 'rostro-app/**', '.github/workflows/rostro-app.yml']
  pull_request:
    paths: ['rostro/**', 'ojo/vendor/**', 'ojo/models/**', 'rostro-app/**', '.github/workflows/rostro-app.yml']

permissions:
  contents: write

concurrency:
  group: rostro-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rostro-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rostro-app/package-lock.json
      - run: npm ci
      - run: npm run dist:${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: voidloom-rostro-${{ matrix.target }}
          path: |
            rostro-app/dist/*.exe
            rostro-app/dist/*.dmg
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Release rostro-app-latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la out
          gh release delete rostro-app-latest --cleanup-tag -y || true
          gh release create rostro-app-latest out/* --prerelease --target "$GITHUB_SHA" \
            --title "VØID_LOOM · ROSTRO · app de escritorio (última)" \
            --notes "App de escritorio de VØID_LOOM · ROSTRO para Windows y Mac: una cabeza gigante que se contorsiona al ritmo de su sonido, con modo ESPEJO. Funciona sin internet. Instrucciones en rostro-app/README.md."
