# VØID_LOOM LIVE · genera la app de escritorio para Windows y Mac
# Se ejecuta al cambiar live/ o live-app/ en main, o a mano desde la pestaña Actions.
# Deja los ejecutables en la release "live-app-latest" del repo.
name: VØID_LOOM LIVE · app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['live/**', 'live-app/**', '.github/workflows/live-app.yml']

permissions:
  contents: write

concurrency:
  group: live-app
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: live-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: live-app/package-lock.json
      - run: npm ci
      - run: npm run dist:${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: voidloom-live-${{ matrix.target }}
          path: |
            live-app/dist/*.exe
            live-app/dist/*.dmg
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Release live-app-latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la out
          gh release delete live-app-latest --cleanup-tag -y || true
          gh release create live-app-latest out/* --prerelease --target "$GITHUB_SHA" \
            --title "VØID_LOOM LIVE · app de escritorio (última)" \
            --notes "App de escritorio de VØID_LOOM LIVE para Windows y Mac. Funciona sin internet y se actualiza sola con las piezas nuevas de Labs cuando hay conexión. Instrucciones en live-app/README.md."
