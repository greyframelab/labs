# VØID_LOOM · OJO · genera la app de escritorio para Windows y Mac
# Se ejecuta al cambiar ojo/ u ojo-app/ en main, o a mano desde la pestaña Actions.
# Deja los ejecutables en la release "ojo-app-latest" del repo.
name: VØID_LOOM · OJO · app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ojo/**', 'ojo-app/**', '.github/workflows/ojo-app.yml']

permissions:
  contents: write

concurrency:
  group: ojo-app
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ojo-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ojo-app/package-lock.json
      - run: npm ci
      - run: npm run dist:${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: voidloom-ojo-${{ matrix.target }}
          path: |
            ojo-app/dist/*.exe
            ojo-app/dist/*.dmg
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Release ojo-app-latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la out
          gh release delete ojo-app-latest --cleanup-tag -y || true
          gh release create ojo-app-latest out/* --prerelease --target "$GITHUB_SHA" \
            --title "VØID_LOOM · OJO · app de escritorio (última)" \
            --notes "App de escritorio de VØID_LOOM · OJO para Windows y Mac: la cámara proyectada tal como la ve una máquina. Funciona sin internet; todo (modelos de IA incluidos) va dentro. Instrucciones en ojo-app/README.md."
