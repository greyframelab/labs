# VØID_LOOM · MENSAJERO · genera la app de escritorio para Windows y Mac
# Se ejecuta al cambiar mensajero/ o mensajero-app/ en main, o a mano desde la pestaña Actions.
# En una PR también genera la app (artefactos descargables desde la ejecución) para probarla antes del merge.
# Mete dentro todo el código y el modelo de la antena. Necesita internet para el feed real de la DSN; sin red sigue en MEMORIA.
# Deja los ejecutables en la release "mensajero-app-latest" del repo.
name: VØID_LOOM · MENSAJERO · app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['mensajero/**', 'mensajero-app/**', '.github/workflows/mensajero-app.yml']
  pull_request:
    paths: ['mensajero/**', 'mensajero-app/**', '.github/workflows/mensajero-app.yml']

permissions:
  contents: write

concurrency:
  group: mensajero-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: mensajero-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mensajero-app/package-lock.json
      - run: npm ci
      - run: npm run dist:${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: voidloom-mensajero-${{ matrix.target }}
          path: |
            mensajero-app/dist/*.exe
            mensajero-app/dist/*.dmg
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Release mensajero-app-latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la out
          gh release delete mensajero-app-latest --cleanup-tag -y || true
          gh release create mensajero-app-latest out/* --prerelease --target "$GITHUB_SHA" \
            --title "VØID_LOOM · MENSAJERO · app de escritorio (última)" \
            --notes "App de escritorio de VØID_LOOM · MENSAJERO para Windows y Mac: la antena de 70 m revelada por las señales reales que recibe ahora mismo la NASA Deep Space Network (necesita internet; sin red sigue en MEMORIA). Consola en tu pantalla y SALIDA sola en el proyector. Instrucciones en mensajero-app/README.md."
