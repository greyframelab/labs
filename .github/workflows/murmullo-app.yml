# VØID_LOOM · MURMULLO · genera la app de escritorio para Windows y Mac
# Se ejecuta al cambiar murmullo/ o murmullo-app/ en main, o a mano desde la pestaña Actions.
# En una PR también genera la app (artefactos descargables desde la ejecución) para probarla antes del merge.
# Mete dentro todo el código. Necesita internet para el flujo real de Wikipedia; sin red sigue en MEMORIA.
# Deja los ejecutables en la release "murmullo-app-latest" del repo.
name: VØID_LOOM · MURMULLO · app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['murmullo/**', 'murmullo-app/**', '.github/workflows/murmullo-app.yml']
  pull_request:
    paths: ['murmullo/**', 'murmullo-app/**', '.github/workflows/murmullo-app.yml']

permissions:
  contents: write

concurrency:
  group: murmullo-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: murmullo-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: murmullo-app/package-lock.json
      - run: npm ci
      - run: npm run dist:${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: voidloom-murmullo-${{ matrix.target }}
          path: |
            murmullo-app/dist/*.exe
            murmullo-app/dist/*.dmg
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Release murmullo-app-latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la out
          gh release delete murmullo-app-latest --cleanup-tag -y || true
          gh release create murmullo-app-latest out/* --prerelease --target "$GITHUB_SHA" \
            --title "VØID_LOOM · MURMULLO · app de escritorio (última)" \
            --notes "App de escritorio de VØID_LOOM · MURMULLO para Windows y Mac: el mundo escribe en una losa de obsidiana. Las ediciones de Wikipedia de todo el planeta, en tiempo real, se tallan y suenan (necesita internet; sin red sigue en MEMORIA). Consola en tu pantalla y SALIDA sola en el proyector. Instrucciones en murmullo-app/README.md."
